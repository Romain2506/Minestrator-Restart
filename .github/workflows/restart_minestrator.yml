name: Minestrator-Restart

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'  # toutes les heures, à 17 (PAS pile à :00 — GitHub déconseille cron
                           # au pile de l'heure, moment le plus chargé, où des exécutions peuvent
                           # être retardées ou carrément sautées)
                           # le script décide lui-même s'il doit agir
                           # (pause silencieuse 1h-6h heure de Paris, gérée côté Python avec zoneinfo)

permissions:
  contents: write   # nécessaire pour committer restart_schedule.json

jobs:
  run_minestrator_restart:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下载代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🛡️ 启动代理客户端 (sing-box)
        env:
          NODE_URL: ${{ secrets.GOST_PROXY }}
        run: |
          if [ -z "$NODE_URL" ]; then
            echo "⚠️ 未配置 GOST_PROXY Secret，跳过代理启动"
            exit 0
          fi

          python gen_proxy.py "$NODE_URL"
          echo "📄 生成的配置结构检查："
          cat sing-box-config.json | sed 's/"password": "[^"]*"/"password": "***"/g; s/"uuid": "[^"]*"/"uuid": "***"/g'

          SB_VER="1.10.7"
          echo "📦 下载 sing-box 版本: $SB_VER"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SB_VER}-linux-amd64.tar.gz"
          mv sing-box-${SB_VER}-linux-amd64/sing-box ./sing-box
          chmod +x sing-box

          nohup ./sing-box run -c sing-box-config.json > singbox.log 2>&1 &
          sleep 3

          echo "📋 sing-box 运行日志："
          cat singbox.log
          echo "🌐 测试代理出口连通性..."
          curl -f -s --connect-timeout 15 -x http://127.0.0.1:8080 https://api.ipify.org
          echo ""

      - name: 🛠️ 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot

      - name: 🐍 安装 Python 依赖
        run: |
          pip install seleniumbase
          seleniumbase install chromedriver
          seleniumbase install chrome

      - name: 🚀 运行脚本
        env:
          PYTHONIOENCODING: utf-8
          MINESTRATOR_ACCOUNT: ${{ secrets.MINESTRATOR_ACCOUNT }}
          MINESTRATOR_SERVER_ID: ${{ secrets.MINESTRATOR_SERVER_ID }}
          MINESTRATOR_AUTH: ${{ secrets.MINESTRATOR_AUTH }}
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python restart_minestrator.py

      - name: 📸 上传截图（调试用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"

      - name: 📤 Commit restart_schedule.json
        if: always()
        run: |
          if [ -f restart_schedule.json ] || [ -f restart_schedule.txt ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add restart_schedule.json restart_schedule.txt 2>/dev/null || true
            git commit -m "chore: update restart schedule [skip ci]" || echo "Rien à committer"
            git push || echo "⚠️ push échoué (ok si rien à commit)"
          fi
